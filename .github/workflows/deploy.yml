name: build-scan-deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Trivy scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD":/out \
            -e TRIVY_DB_REPOSITORY=public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2 \
            aquasec/trivy:0.58.1 image \
            --scanners vuln --format json --output /out/trivy.json \
            --exit-code 0 "$IMAGE:${{ github.sha }}"

      - name: Quality gate
        run: |
          count() { jq "[.Results[]?.Vulnerabilities[]? | select(.Severity==\"$1\")] | length" trivy.json; }
          LOW=$(count LOW); MED=$(count MEDIUM); HIGH=$(count HIGH); CRIT=$(count CRITICAL)
          TOTAL=$((LOW+MED+HIGH+CRIT))
          echo "total=$TOTAL low+medium=$((LOW+MED)) high+critical=$((HIGH+CRIT))"
          if [ "$TOTAL" -ge 10 ] || [ $((LOW+MED)) -ge 8 ] || [ $((HIGH+CRIT)) -ge 2 ]; then
            echo "Quality gate failed"
            exit 1
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        run: docker push --all-tags "$IMAGE"

      - name: Deploy over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          install -m 600 /dev/null key.pem
          printf '%s\n' "$SSH_PRIVATE_KEY" > key.pem
          OPTS="-i key.pem -o StrictHostKeyChecking=accept-new"
          REMOTE="$SSH_USER@$SSH_HOST"

          ssh $OPTS "$REMOTE" "mkdir -p ~/myurls"
          scp $OPTS docker-compose.yml Caddyfile "$REMOTE:myurls/"

          printf 'IMAGE=%s:%s\nADMIN_PASSWORD=%s\n' "$IMAGE" "$GITHUB_SHA" "$ADMIN_PASSWORD" \
            | ssh $OPTS "$REMOTE" "umask 077; cat > ~/myurls/.env"

          printf '%s' "$GH_TOKEN" \
            | ssh $OPTS "$REMOTE" "docker login ghcr.io -u '$GH_ACTOR' --password-stdin"

          ssh $OPTS "$REMOTE" "cd ~/myurls && docker compose pull && docker compose up -d --remove-orphans && docker image prune -f"

          rm -f key.pem
