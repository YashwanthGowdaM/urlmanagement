name: build-scan-deploy
on:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }},${{ env.IMAGE }}:latest
      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: json
          output: trivy.json
          exit-code: "0"
      - name: Quality gate
        run: |
          c() { jq "[.Results[]?.Vulnerabilities[]? | select($1)] | length" trivy.json; }
          LOW=$(c '.Severity=="LOW"'); MED=$(c '.Severity=="MEDIUM"')
          HIGH=$(c '.Severity=="HIGH"'); CRIT=$(c '.Severity=="CRITICAL"')
          TOTAL=$((LOW+MED+HIGH+CRIT))
          echo "total=$TOTAL low+medium=$((LOW+MED)) high+critical=$((HIGH+CRIT))"
          [ "$TOTAL" -lt 10 ] && [ $((LOW+MED)) -lt 8 ] && [ $((HIGH+CRIT)) -lt 2 ] || { echo "Quality gate failed"; exit 1; }
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push to GHCR
        run: docker push --all-tags "$IMAGE"
      - name: Deploy over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -m 600 /dev/null key.pem && printf '%s\n' "$SSH_PRIVATE_KEY" > key.pem
          O="-i key.pem -o StrictHostKeyChecking=accept-new"
          ssh $O "$SSH_USER@$SSH_HOST" "mkdir -p ~/myurls"
          scp $O docker-compose.yml Caddyfile "$SSH_USER@$SSH_HOST:myurls/"
          printf 'IMAGE=%s:%s\nADMIN_PASSWORD=%s\n' "$IMAGE" "$GITHUB_SHA" "$ADMIN_PASSWORD" \
            | ssh $O "$SSH_USER@$SSH_HOST" "umask 077; cat > ~/myurls/.env"
          printf '%s' "$GH_TOKEN" | ssh $O "$SSH_USER@$SSH_HOST" "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          ssh $O "$SSH_USER@$SSH_HOST" "cd ~/myurls && docker compose pull && docker compose up -d --remove-orphans && docker image prune -f"
          rm -f key.pem
