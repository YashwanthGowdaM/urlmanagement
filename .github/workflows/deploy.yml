name: build-scan-deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Trivy scan
        id: scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD":/out \
            -e TRIVY_DB_REPOSITORY=public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2 \
            aquasec/trivy:0.58.1 image \
            --scanners vuln --format json --output /out/trivy.json \
            --exit-code 0 "$IMAGE:${{ github.sha }}"

      - name: Quality gate and scan report
        id: gate
        run: |
          count() { jq "[.Results[]?.Vulnerabilities[]? | select(.Severity==\"$1\")] | length" trivy.json; }
          CRIT=$(count CRITICAL); HIGH=$(count HIGH); MED=$(count MEDIUM)
          LOW=$(count LOW); UNK=$(count UNKNOWN)
          LM=$((LOW+MED)); HC=$((HIGH+CRIT)); TOTAL=$((CRIT+HIGH+MED+LOW))
          st() { if [ "$1" -lt "$2" ]; then echo "✅ Pass"; else echo "❌ Fail"; fi; }

          {
            echo "## Trivy scan report"
            echo
            echo "Image: \`$IMAGE:$GITHUB_SHA\`"
            echo
            echo "### Quality gate"
            echo
            echo "| Severity | Allowed count | Actual count | Status |"
            echo "|---|---|---|---|"
            echo "| Low + Medium | < 8 | $LM | $(st $LM 8) |"
            echo "| High + Critical | < 2 | $HC | $(st $HC 2) |"
            echo "| Total | < 10 | $TOTAL | $(st $TOTAL 10) |"
            echo
            echo "### Count by severity"
            echo
            echo "| Severity | Count |"
            echo "|---|---|"
            echo "| Critical | $CRIT |"
            echo "| High | $HIGH |"
            echo "| Medium | $MED |"
            echo "| Low | $LOW |"
            echo "| Unknown (not counted in the gate) | $UNK |"
            echo
            echo "### All vulnerabilities"
            echo
            if [ "$((TOTAL+UNK))" -eq 0 ]; then
              echo "No vulnerabilities found."
            else
              echo "| Severity | Package | Vulnerability | Installed | Fixed in | Title |"
              echo "|---|---|---|---|---|---|"
              jq -r '
                def rank: {"CRITICAL":0,"HIGH":1,"MEDIUM":2,"LOW":3}[.] // 4;
                [.Results[]?.Vulnerabilities[]?] | sort_by(.Severity | rank)[] |
                "| \(.Severity) | \(.PkgName) | [\(.VulnerabilityID)](\(.PrimaryURL // "")) | \(.InstalledVersion // "-") | \(.FixedVersion // "-") | \((.Title // "-") | gsub("\\|"; "/") | gsub("\n"; " ") | .[0:90]) |"
              ' trivy.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "total=$TOTAL low+medium=$LM high+critical=$HC"
          if [ "$TOTAL" -ge 10 ] || [ "$LM" -ge 8 ] || [ "$HC" -ge 2 ]; then
            echo "Quality gate failed"
            exit 1
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        id: push
        run: docker push --all-tags "$IMAGE"

      - name: Deploy over SSH
        id: deploy
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          install -m 600 /dev/null key.pem
          printf '%s\n' "$SSH_PRIVATE_KEY" > key.pem
          OPTS="-i key.pem -o StrictHostKeyChecking=accept-new"
          REMOTE="$SSH_USER@$SSH_HOST"

          ssh $OPTS "$REMOTE" "mkdir -p ~/producturl"
          scp $OPTS docker-compose.yml Caddyfile "$REMOTE:producturl/"

          printf 'IMAGE=%s:%s\nADMIN_PASSWORD=%s\n' "$IMAGE" "$GITHUB_SHA" "$ADMIN_PASSWORD" \
            | ssh $OPTS "$REMOTE" "umask 077; cat > ~/producturl/.env"

          printf '%s' "$GH_TOKEN" \
            | ssh $OPTS "$REMOTE" "docker login ghcr.io -u '$GH_ACTOR' --password-stdin"

          ssh $OPTS "$REMOTE" "cd ~/producturl && docker compose pull && docker compose up -d --remove-orphans && docker image prune -f"
          ssh $OPTS "$REMOTE" "cd ~/producturl && docker compose ps" | tee compose-ps.txt

          rm -f key.pem

      - name: Deployment summary
        if: always()
        env:
          B: ${{ steps.build.outcome }}
          S: ${{ steps.scan.outcome }}
          G: ${{ steps.gate.outcome }}
          P: ${{ steps.push.outcome }}
          D: ${{ steps.deploy.outcome }}
          JOB: ${{ job.status }}
        run: |
          show() {
            case "$1" in
              success) echo "✅ Success" ;;
              skipped) echo "⏭️ Skipped" ;;
              cancelled) echo "⚠️ Cancelled" ;;
              *) echo "❌ Failed" ;;
            esac
          }
          {
            echo "## Deployment summary"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Result | $(show "$JOB") |"
            echo "| Site | https://producturl.yashwanthgowdam.in |"
            echo "| Image | \`$IMAGE:$GITHUB_SHA\` |"
            echo "| Commit | \`${GITHUB_SHA::7}\` by ${{ github.actor }} |"
            echo "| Branch | ${{ github.ref_name }} |"
            echo
            echo "### Pipeline steps"
            echo
            echo "| Step | Status |"
            echo "|---|---|"
            echo "| Build image | $(show "$B") |"
            echo "| Trivy scan | $(show "$S") |"
            echo "| Quality gate | $(show "$G") |"
            echo "| Push to GHCR | $(show "$P") |"
            echo "| Deploy over SSH | $(show "$D") |"
            if [ -f compose-ps.txt ]; then
              echo
              echo "### Running containers"
              echo
              echo '```'
              cat compose-ps.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
